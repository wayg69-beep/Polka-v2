name: Generate Android Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Generate Keystore
        run: |
          keytool -genkeypair -v \
          -keystore release.keystore \
          -alias polka \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -storetype JKS \
          -storepass polka123 \
          -keypass polka123 \
          -dname "CN=Polka, OU=Dev, O=Polka, L=City, ST=State, C=US"

      - name: Print Base64 to Log
        run: |
          echo "=== НАЧАЛО СТРОКИ ==="
          base64 -w 0 release.keystore
          echo ""
          echo "=== КОНЕЦ СТРОКИ ==="

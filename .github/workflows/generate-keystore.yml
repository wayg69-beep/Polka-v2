name: Generate Android Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Generate Keystore
        run: |
          keytool -genkeypair -v -noprompt \
            -keystore release.keystore \
            -alias polka \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storetype JKS \
            -storepass polka123 \
            -keypass polka123 \
            -dname "CN=Polka, OU=Dev, O=Polka, L=City, ST=State, C=US"

      - name: Print Base64
        run: |
          echo "=== НАЧАЛО СТРОКИ ==="
          base64 -w 0 release.keystore
          echo ""
          echo "=== КОНЕЦ СТРОКИ ==="
